name: 🚀 Build and Deploy Website

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ══════════════════════════════════════════════
  # JOB 1: TEST — Validate the website
  # ══════════════════════════════════════════════
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Verify required files exist
        run: |
          echo "Checking for required files..."
          test -f src/index.html || (echo "❌ src/index.html missing" && exit 1)
          test -f src/style.css  || (echo "❌ src/style.css missing" && exit 1)
          test -f src/script.js  || (echo "❌ src/script.js missing" && exit 1)
          echo "✅ All required files present!"

      - name: 🔍 Validate HTML structure
        run: |
          echo "Validating HTML..."
          grep -qi "<!DOCTYPE html>" src/index.html || (echo "❌ Missing DOCTYPE" && exit 1)
          grep -qi "<title>" src/index.html || (echo "❌ Missing title" && exit 1)
          echo "✅ HTML structure looks good!"

  # ══════════════════════════════════════════════
  # JOB 2: DEPLOY — Publish to GitHub Pages
  # ══════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src'

      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4